name: Build and Push Image

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/demo-preview-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            EFFECTIVE_SHA="${{ github.event.pull_request.head.sha }}"
          else
            EFFECTIVE_SHA="${GITHUB_SHA}"
          fi

          SHORT_SHA="${EFFECTIVE_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            echo "IMAGE_TAG=pr-$PR_NUMBER" >> "$GITHUB_ENV"
            echo "EXTRA_TAG=${EFFECTIVE_SHA}" >> "$GITHUB_ENV"
            echo "APP_ENV=preview" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main" >> "$GITHUB_ENV"
            echo "EXTRA_TAG=${EFFECTIVE_SHA}" >> "$GITHUB_ENV"
            echo "APP_ENV=main" >> "$GITHUB_ENV"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.EXTRA_TAG }}
